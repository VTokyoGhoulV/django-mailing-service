[project]
name = "django-mailing-service"
version = "0.1.0"
description = "Email mailing management service with user permissions and delivery statistics"
authors = [
    {name = "VTokyoGhoulV"}
]
requires-python = "^3.14"
dependencies = [
    "django (>=6.1.1,<7.0.0)",
    "python-dotenv (>=1.2.3,<2.0.0)",
    "psycopg2 (>=2.9.13,<3.0.0)",
    "redis (>=8.1.0,<9.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
